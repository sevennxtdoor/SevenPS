<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#16324a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ee08f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3ee08f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5df2a4"/>
      <stop offset="1" stop-color="#3cc8f0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="260" rx="22" fill="url(#bg)"/>

  <!-- faint pixel grid -->
  <g fill="#ffffff" opacity="0.04">
    <rect x="40" y="30" width="18" height="18"/><rect x="62" y="30" width="18" height="18"/>
    <rect x="40" y="52" width="18" height="18"/>
    <rect x="820" y="190" width="18" height="18"/><rect x="842" y="190" width="18" height="18"/>
    <rect x="842" y="212" width="18" height="18"/>
    <rect x="780" y="34" width="14" height="14"/><rect x="110" y="208" width="14" height="14"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#5df2a4" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="square">
    <path d="M30 60 V30 H60"/>
    <path d="M840 30 H870 V60"/>
    <path d="M30 200 V230 H60"/>
    <path d="M840 230 H870 V200"/>
  </g>

  <ellipse cx="260" cy="130" rx="120" ry="110" fill="url(#glow)"/>

  <!-- icon: pixel block with a 7 -->
  <g transform="translate(190 60)">
    <rect x="6" y="6" width="140" height="140" rx="18" fill="#000000" opacity="0.25"/>
    <rect width="140" height="140" rx="18" fill="#1f8f5f"/>
    <rect width="140" height="70" rx="18" fill="#2bb377"/>
    <rect y="52" width="140" height="18" fill="#2bb377"/>
    <g fill="#ffffff" opacity="0.12">
      <rect x="14" y="14" width="22" height="22" rx="4"/>
      <rect x="104" y="104" width="22" height="22" rx="4"/>
    </g>
    <path d="M38 34 H104 V52 L72 112 H50 L80 54 H38 Z" fill="#ffffff"/>
  </g>

  <text x="370" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="url(#txt)" letter-spacing="1">SevenPS</text>
  <text x="374" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#c9d6e3" letter-spacing="3">SEVEN PRIVATE SERVER</text>
</svg>
