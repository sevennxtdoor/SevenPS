<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seven Private Server Login</title>
<!-- SevenPS's own login page, served by our server (include/https/https.cpp). The password is only sent to
     /player/login/validate on this same server; the game itself only receives a random session token. -->
<style>
  :root { --bg1: #0b1d3a; --bg2: #1d4f8c; --card: #102a52; --line: #2c5a96; --text: #eef5ff; --muted: #9fb7d9;
          --gold: #ffd34d; --green: #3ccf6e; --red: #ff6b6b; --field: #0a1f40; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; color: var(--text);
         background: linear-gradient(160deg, var(--bg1), var(--bg2)); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { width: 100%; max-width: 380px; background: var(--card); border: 2px solid var(--line); border-radius: 18px;
          padding: 22px 22px 18px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .logo { text-align: center; margin-bottom: 14px; }
  .logo h1 { margin: 0; font-size: 30px; letter-spacing: 1px; color: var(--gold); text-shadow: 0 3px 0 #a3700a; }
  .logo p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .tabs { display: flex; gap: 6px; background: var(--field); padding: 4px; border-radius: 12px; margin-bottom: 16px; }
  .tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600;
                 padding: 9px; border-radius: 9px; cursor: pointer; }
  .tabs button.on { background: var(--line); color: var(--text); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 5px; }
  input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--field);
          color: var(--text); font-size: 16px; outline: none; }
  input:focus { border-color: var(--gold); }
  .go { width: 100%; margin-top: 16px; padding: 12px; border: 0; border-radius: 12px; font: inherit; font-size: 17px; font-weight: 700;
        background: var(--green); color: #06301a; cursor: pointer; box-shadow: 0 4px 0 #1f8a45; }
  .go:active { transform: translateY(2px); box-shadow: 0 2px 0 #1f8a45; }
  .go:disabled { opacity: .6; cursor: default; }
  .msg { min-height: 20px; margin-top: 12px; font-size: 14px; text-align: center; }
  .msg.bad { color: var(--red); } .msg.good { color: var(--green); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .safe { margin-top: 14px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.4; }
  .hidden { display: none; }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">
      <h1>Seven Private Server</h1>
      <p>Private Growtopia Server</p>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" id="tab-login" class="on" onclick="pick('login')">Log in</button>
      <button type="button" id="tab-register" onclick="pick('register')">New account</button>
    </div>

    <form id="form" onsubmit="return send(event)" autocomplete="on">
      <label for="growId">GrowID</label>
      <input id="growId" name="growId" maxlength="18" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      <div class="hint hidden" id="growid-hint">3-18 letters or numbers.</div>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" maxlength="64" autocomplete="current-password" required>

      <div id="confirm-box" class="hidden">
        <label for="confirm">Password again</label>
        <input id="confirm" name="confirm" type="password" maxlength="64" autocomplete="new-password">
        <div class="hint">At least 4 characters. Use a password you don't use anywhere else.</div>
      </div>

      <button class="go" id="go" type="submit">Log in</button>
      <div class="msg" id="msg" role="status"></div>
    </form>

    <div class="safe">Your password is only checked by the SevenPS server.<br>Staff will never ask for it.</div>
  </main>

<script>
  var mode = 'login';

  function pick(m) {
    mode = m;
    document.getElementById('tab-login').className = m === 'login' ? 'on' : '';
    document.getElementById('tab-register').className = m === 'register' ? 'on' : '';
    document.getElementById('confirm-box').className = m === 'register' ? '' : 'hidden';
    document.getElementById('growid-hint').className = m === 'register' ? 'hint' : 'hint hidden';
    document.getElementById('password').autocomplete = m === 'register' ? 'new-password' : 'current-password';
    document.getElementById('go').textContent = m === 'register' ? 'Create account' : 'Log in';
    say('', '');
    document.getElementById('go').disabled = false; // @note say() stopped a countdown: don't leave the button off
  }

  var timer = null; // @note the "Try again in N seconds" countdown

  function say(text, kind) {
    if (timer) { clearInterval(timer); timer = null; }
    var el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + kind;
  }

  /* @note the server says the wait once; count it down here and keep the button off until it's over */
  function wait_out(text) {
    /* "Try again in 24 seconds." (one account) or "Try again in 4:47." (your connection) */
    var m = /^(.*Try again in )(?:(\d+) seconds?|(\d+):(\d\d))\.$/.exec(text);
    if (!m) return false;
    var clock = m[3] !== undefined;
    var left = clock ? parseInt(m[3], 10) * 60 + parseInt(m[4], 10) : parseInt(m[2], 10);
    var go = document.getElementById('go');
    var show = function () {
      document.getElementById('msg').textContent = m[1] + (clock ?
        Math.floor(left / 60) + ':' + ('0' + left % 60).slice(-2) + '.' :
        left + (left === 1 ? ' second.' : ' seconds.'));
    };
    say(text, 'bad');
    go.disabled = true;
    show();
    timer = setInterval(function () {
      if (--left > 0) return show();
      say('You can try again now.', '');
      go.disabled = false;
    }, 1000);
    return true;
  }

  function send(e) {
    e.preventDefault();
    var growId = document.getElementById('growId').value.trim();
    var password = document.getElementById('password').value;
    var confirm = document.getElementById('confirm').value;

    if (!/^[A-Za-z0-9]{3,18}$/.test(growId)) { say('Your GrowID is 3-18 letters or numbers.', 'bad'); return false; }
    if (mode === 'register' && password.length < 4) { say('Pick a password with at least 4 characters.', 'bad'); return false; }
    if (mode === 'register' && password !== confirm) { say('The two passwords are not the same.', 'bad'); return false; }

    var body = 'mode=' + encodeURIComponent(mode) + '&growId=' + encodeURIComponent(growId) +
               '&password=' + encodeURIComponent(password) + '&confirm=' + encodeURIComponent(confirm);
    var go = document.getElementById('go');
    go.disabled = true;
    say(mode === 'register' ? 'Creating your account...' : 'Checking...', '');

    fetch('/player/login/validate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (data.status === 'success' && data.token) {
        say('Welcome to SevenPS!', 'good');
        /* the game reads the token from this page's answer */
        window.location.href = '/player/growid/login/validate?token=' + encodeURIComponent(data.token);
      } else if (!wait_out(data.message || '')) {
        say(data.message || 'Something went wrong.', 'bad');
        go.disabled = false;
      }
    }).catch(function () {
      say('Could not reach the server. Is it running?', 'bad');
      go.disabled = false;
    });
    return false;
  }
</script>
</body>
</html>
